format = "$directory$git_branch$git_status$cmd_duration $character "
add_newline = false
palette = "brokenback"

[palettes.brokenback]
cyan = "#7ddfe8"
peach = "#ffb08a"
sage = "#c6d69a"
muted = "#879692"
fg = "#dce8e6"
danger = "#ff7a90"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false

[git_branch]
style = "sage"
format = " [$symbol$branch]($style)"
symbol = " "

[git_status]
style = "peach"
format = " [$all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 1000
style = "muted"
format = " [$duration]($style)"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold danger)"
