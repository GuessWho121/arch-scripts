[colors]
transparent = #00000000
panel = #9a14191c
panel-solid = #dd14191c
card = #ee1f282d
card-alt = #ee273238
fg = #dce8e6
muted = #879692
accent = #7ddfe8
accent-soft = #807ddfe8
accent-alt = #c6d69a
peach = #ffb08a
danger = #ff7a90
ink = #101418
pill-border = #667ddfe8

[bar/base]
monitor = ${env:MONITOR:}
height = 44
offset-y = 5
fixed-center = true
bottom = false
background = ${colors.transparent}
foreground = ${colors.fg}
line-size = 0
border-size = 0
padding-left = 0
padding-right = 0
module-margin = 0
font-0 = SpaceMono Nerd Font Mono:style=Bold:size=12;3
font-1 = SpaceMono Nerd Font Mono:style=Bold:size=14;3
font-2 = SpaceMono Nerd Font Mono:style=Bold:size=17;4
font-3 = IBM Plex Sans:size=12;3
wm-restack = bspwm
override-redirect = false
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/brokenback-left]
inherit = bar/base
width = ${env:BB_LEFT_W:300}
offset-x = ${env:BB_LEFT_X:10}
radius = 22
background = ${colors.panel}
border-size = 1
border-color = ${colors.pill-border}
padding-left = 2
padding-right = 2
modules-center = workspaces

[bar/brokenback-center]
inherit = bar/base
width = ${env:BB_CENTER_W:368}
offset-x = ${env:BB_CENTER_X:480}
radius = 22
background = ${colors.panel-solid}
border-size = 1
border-color = ${colors.pill-border}
padding-left = 2
padding-right = 2
modules-center = center-status

[bar/brokenback-windowcount]
inherit = bar/base
width = ${env:BB_WINDOWCOUNT_W:78}
offset-x = ${env:BB_WINDOWCOUNT_X:1120}
radius = 22
background = ${colors.peach}
foreground = ${colors.ink}
border-size = 1
border-color = ${colors.pill-border}
padding-left = 1
padding-right = 1
modules-center = windowcount

[bar/brokenback-battery]
inherit = bar/base
width = ${env:BB_BATTERY_W:96}
offset-x = ${env:BB_BATTERY_X:1200}
radius = 22
background = ${colors.card-alt}
border-size = 1
border-color = ${colors.pill-border}
padding-left = 1
padding-right = 1
modules-center = battery

[bar/brokenback-datetime]
inherit = bar/base
width = ${env:BB_DATETIME_W:240}
offset-x = ${env:BB_DATETIME_X:1304}
radius = 22
background = ${colors.card}
border-size = 1
border-color = ${colors.pill-border}
padding-left = 1
padding-right = 1
modules-center = datetime


[module/workspaces]
type = custom/script
exec = ~/.local/bin/brokenback-workspaces-status
interval = 1
format = <label>
format-padding = 0
label = %output%

[module/center-status]
type = custom/script
exec = ~/.local/bin/brokenback-center-status
interval = 2
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
label-maxlen = 43

[module/windowcount]
type = custom/script
exec = ~/.local/bin/brokenback-window-count-status
interval = 1
click-left = /home/guesswho/.local/bin/brokenback-hub-toggle
format = <label>
format-foreground = ${colors.ink}
format-padding = 0
label = %output%

[module/battery]
type = custom/script
exec = ~/.local/bin/brokenback-battery-status
interval = 10
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %output%

[module/datetime]
type = internal/date
interval = 1
date = %a, %b %d
time = %I:%M %p
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %{A1:/home/guesswho/.local/bin/brokenback-calendar-toggle:}%{F#c6d69a}%date%%{F-}  %time%%{A}


[settings]
screenchange-reload = true
pseudo-transparency = false
